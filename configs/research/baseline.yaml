# Research demand/carrier/carbon contracts only; never an upstream solve config.
research_demand:
  schema: phase4-gate2-v1
  mode: static_demand_only
  builder: scripts_project/build_research_demand.py
  input_directory: research_inputs/demand
  electricity_parent: electricity_parent.csv
  tables:
    - electricity_parent.csv
    - buildings_accounting.csv
    - transport_accounting.csv
    - industry_accounting.csv
    - agriculture_accounting.csv
    - bunker_accounting.csv
  numeric_acceptance_required: true
  legacy_demand_builders: forbidden
  astar_boundary: end_user_final_electricity
  aeo8_generation_target: false
  aeo8_final_electricity_role: assembly_v1_regional_anchor
  heat_without_accepted_service: embedded
  future_growth_fallback: forbidden
  solver_allowed: false

research_carrier_architecture:
  schema: phase4-gate3-v1
  mode: static_fragments_only
  builder: scripts_project/carrier_architecture.py
  ownership: explicit_node_country
  cross_border_h2: false
  cross_border_gas: false
  cross_border_co2: false
  cross_border_biomass: false
  cross_border_synthetic_fuels: false
  ammonia: deferred
  methanol: deferred
  external_h2_imports: deferred
  h2_export_obligation: deferred_pending_accepted_boundary
  external_market: independent_source_generators_shared_price_metadata_only
  finite_resource_allocation: human_accepted_only_no_replication
  co2_feedstock: local_captured_pool
  co2_geology: local_nonwithdrawable_inventory
  electricity_intervention: deferred_keep_identical_interfaces
  topology_repair: repaired_d13d5976
  solver_allowed: false

research_carbon:
  policy_name: PolicyCO2_Power
  reporting_name: ReportingCO2_FullSystem
  policy_enabled: false  # Preserve original baseline co2.budget.enable=false.
  budget_tco2_per_year:
    2025: 1000000000
    2030: 820000000
    2035: 640000000
    2040: 460000000
    2045: 280000000
    2050: 100000000
  power_scope: explicit_accepted_component_coefficients
  shared_smr_chp_attribution: pending_human_accepted_split
  atmosphere: reporting_only_zero_policy_carrier_factor
  reporting_creates_cap: false
  full_system_cap: forbidden
  origin_neutrality_assumption: forbidden
  preserved_baseline_enable_semantics: true

# Gate4 input gate only. A runnable Full-SC assembly is blocked until the
# target-year source, supply and allocation gates close. Carbon attribution
# is validated on the actual network after export, before Gate4 can pass.
demand_data:
  update_data: false
final_adjustment:
  only_elec_network: false
research_assembly:
  schema: phase4-gate4-layered-v2
  builder: scripts_project/build_research_network.py
  allocation_builder: scripts_project/allocate_assembly_inputs.py
  research_workflow: workflow/research_assembly.smk
  input_registry: research_inputs/assembly_v1/registry.json
  target_year: 2050
  base_year: 2019
  accepted_status: ASSEMBLY_V1_ACCEPTED
  preflight: scripts_project/check_assembly_inputs.py
  legacy_final_adjustment: forbidden
  legacy_sector_demand_builders: forbidden
  target_year_fallback: forbidden
  network_export_enabled: true # Authorized, but executable input/allocation/asset gates must pass.
  blocked_reason: actual_source_accounts_and_qualified_asset_bundle_incomplete
  scenario_switching: false
  solver_allowed: false
  demand_scenario: AEO8_BAS
  road_parent_method: ASSEMBLY_V1_AEO8_ROAD_PARENT_APPROX
  road_non_electric_method: ASSEMBLY_V1_ROAD_NON_ELECTRIC_TRANSPORT_GROWTH_PROXY
  road_parent_role: ROAD_TOTAL_REFERENCE_ONLY
  road_parent_exact_total_enforced: false
  mtoe_method: ASSEMBLY_V1_MTOE_CONVENTION_11P63_TWH
  non_electric_growth_method: ASSEMBLY_V1_ACCEPTED_GROWTH_PROXY
  domestic_shipping_aviation_method: ASSEMBLY_V1_DOMESTIC_CONSTANT_2019
  road_ev_representation: EMBEDDED_IN_ASTAR
  road_ev_materialisation: NOT_SEPARATELY_MATERIALISED
  road_ev_pathway: DEFERRED_TO_EV_SENSITIVITY
  international_bunker_method: ASSEMBLY_V1_BUNKER_CONSTANT_2019
  bunker_sensitivity_required: true
  external_fossil_market: ASSEMBLY_V1_EXTERNAL_MARKET_UNCONSTRAINED
  biomass_supply_cap: d1_biomass_v5_country_category_stores   # S2-3: the Assembly-V1 regional pool (360 TWh) is retired; potentials per country x category
  geological_storage_asset: false
  carbon_validation_stage: POST_BUILD_STATIC_VALIDATION_BLOCKER

# ---------------------------------------------------------------------------
# S1 (2026-10-15) sector-coupling skeleton. These keys supersede the Phase3
# isolation contract above (research_carrier_architecture.cross_border_* and
# research_carbon.policy_*), which is retained only as historical record.
# Scenario files integrated.yaml / disconnected.yaml override research.cross_border.
# ---------------------------------------------------------------------------
research:
  stage: S1
  scenario: baseline
  skeleton_status: INTERIM_S1_SKELETON   # electricity demand only; results carry no scientific meaning
  fuel_bus_naming: upstream_space        # "<node> <carrier>" as in scripts/prepare_sector_network.py
  solver:                                # S3B R4 (decision 69): Gurobi profiles on the PyPSA-Eur v2025.07.0 config.default.yaml gurobi-default basis (lines 1056-1064)
    profile: formal_barrier              # S4O supplement 01 (decision 121, replaces decision 120 point (2)): the PRODUCTION profile is profile A formal_barrier (Crossover 0, BarConvTol 1e-8) again. Reason: with BarConvTol 1e-5 the returned primal/dual gap lands around 3e-5 (S4O-3: 2.79e-5 with Threads 8), i.e. about 0.015-0.02 bn EUR on this model - the same order as the 0.01 bn decision unit of decisions 107 / 119 (a), so too little margin - and the result depends on the thread path (S4N C2 with threads 32: 7.8e-6). pypsa_eur_default stays registered as a NON-production profile for later calibration | crossover_diagnostic (same settings, Crossover 1) | barrier_numericfocus2 (S4C-5 C: formal_barrier + NumericFocus 2). Between decision 120 (S4O-2, d5b4eb96) and decision 121 the default was pypsa_eur_default
    acceptance: gates_v6                 # M08a A8 (decisions 128, 133; registry gates_v6_contract): run acceptance = GATES_V6 (scripts_project/v5/gates_v6.py: G1 = C1 (a)(b)(c) + G2 structural checks; diagnostics D0-D16 with D2 budget 10 x max(OptimalityTol, BarConvTol); labels ACCEPTED_LAYER2 / ACCEPTED_LAYER1 / NOT_ACCEPTED); the solver status is not a criterion. Former: decision 120 (optimal + C1)
    run_rules:                           # M08a A8 (decision 133): rules registered BEFORE the unattended third / fourth batches (gates_v6.run_rules / select_formal_profile / formal_run_decision; runner scripts_project/m08a_run_batch.sh); not in the G2.2 subset (no effect on the network / LP)
      acceptance: gates_v6
      formal_resolution: 2920x3h
      formal_requires: [c]               # formal 2920x3h runs must pass C1 (c): the Owen allocation uses the duals; ACCEPTED_LAYER1 = total cost only
      formal_time_limit_s: 172800.0      # 48 h TimeLimit for the formal runs
      on_non_convergence: grade_by_c1_no_retry_no_parameter_change   # a run that does not converge is graded by C1 as returned: no retry, no parameter change
      profile_chain:                     # first look at formal_barrier_1e6_t16 in the 365x24h level-2 runs (decision 127): C1 (a)(b)(c) all passed AND |objective - profile A| / |profile A| <= 1e-5 in every level-2 scenario -> formal runs use it; otherwise profile A
        candidate: formal_barrier_1e6_t16
        level2_resolution: 365x24h
        candidate_requires: [a, b, c]
        objective_rel_diff_vs_reference_max: 1.0e-5
        reference: formal_barrier
        fallback: formal_barrier
        never_fallback: [pypsa_eur_default]   # the BarConvTol 1e-5 profile is not a fallback (decision 121 evidence)
    profiles:
      formal_barrier: {Method: 2, Crossover: 0, BarConvTol: 1.0e-8, BarHomogeneous: 1, Threads: 8, Seed: 123, AggFill: 0, PreDual: 0, GURO_PAR_BARDENSETHRESH: 200}
      crossover_diagnostic: {Method: 2, Crossover: 1, BarConvTol: 1.0e-8, BarHomogeneous: 1, Threads: 8, Seed: 123, AggFill: 0, PreDual: 0, GURO_PAR_BARDENSETHRESH: 200}
      barrier_numericfocus2: {Method: 2, Crossover: 0, BarConvTol: 1.0e-8, BarHomogeneous: 1, Threads: 8, Seed: 123, AggFill: 0, PreDual: 0, GURO_PAR_BARDENSETHRESH: 200, NumericFocus: 2}   # S4C-5 (decision 84) C
      formal_barrier_crossover: {Method: 2, Crossover: -1, BarConvTol: 1.0e-8, BarHomogeneous: 1, Threads: 8, Seed: 123, AggFill: 0, PreDual: 0, GURO_PAR_BARDENSETHRESH: 200}   # S4L-2 (decision 113 (2)): profile A with the Gurobi parameter Crossover at its default -1. ABANDONED by the user decision 2026-10-19 (it ended infeasible_or_unbounded in the simplex clean-up after the push phases on all four S4L-2 runs); kept here only as the record of those runs - not to be used for any run; the formal profile stays A (formal_barrier). Gates: with Crossover != 0 s2_solve.py uses the basic-solution KKT gate (gate_a1_a2_kkt) instead of the interior criteria
      pypsa_eur_default: {Threads: 8, Method: 2, Crossover: 0, BarConvTol: 1.e-5, Seed: 123, AggFill: 0, PreDual: 0, GURO_PAR_BARDENSETHRESH: 200}   # NON-production since decision 121 (S4O supplement 01: production back to profile A; S4O-3 calibration standard not passed: objective 2.13e-5 from profile A with Threads 8); kept registered for later calibration. S4O-2 (decision 120): profile = PyPSA-Eur v2025.07.0 config.default.yaml gurobi-default (research_inputs/registry_v5/sources/pypsa_eur_v2025.07.0_config.default.yaml lines 1056-1064, SHA256 bfbe9160db09c3e960b97173bc755492b7638e0f4a5081ffaa1dddd4635da787: threads 32, method 2, crossover 0, BarConvTol 1.e-5, Seed 123, AggFill 0, PreDual 0, GURO_PAR_BARDENSETHRESH 200) with two registered adaptations (registry s4o_decision_120_production_profile): (1) key names capitalised as in the code convention (threads -> Threads, method -> Method, crossover -> Crossover) - Gurobi parameter names are case-insensitive, so the solve is unchanged; only the s2_solve.py gate-path detection (it reads "Crossover") is fixed (S4N finding 10); (2) Threads 8 instead of 32 - a hardware setting: PyPSA-Eur's 32 belongs to its cluster, 8 equals profile A for comparability. All other keys and values as written in the file; no BarHomogeneous or other profile-A-only key. History: added in S4N supplement 02 C2 (decision 119; decision 107 (c) calibration, commit 7c4f97fe) with the lowercase keys and threads 32 as written
      formal_barrier_1e6: {Method: 2, Crossover: 0, BarConvTol: 1.0e-6, BarHomogeneous: 1, Threads: 8, Seed: 123, AggFill: 0, PreDual: 0, GURO_PAR_BARDENSETHRESH: 200}   # S4Q-1 (decision 123): NON-production CANDIDATE profile for calibration only - profile A formal_barrier with ONE factor changed (single factor): BarConvTol 1e-8 -> 1e-6; every other key equal to formal_barrier (unit test tests/research/test_s4q_1.py). Iteration path 1 of the two paths of decision 123: Threads 8 as profile A. Level 1 = local 56x3h against S4M-2 (S4Q); level 2 = cloud 365x24h (separate authorisation). The production profile stays formal_barrier
      formal_barrier_1e6_t16: {Method: 2, Crossover: 0, BarConvTol: 1.0e-6, BarHomogeneous: 1, Threads: 16, Seed: 123, AggFill: 0, PreDual: 0, GURO_PAR_BARDENSETHRESH: 200}   # S4Q-1 (decision 123): NON-production CANDIDATE profile for calibration only - the same candidate (single factor: BarConvTol 1e-8 -> 1e-6) on iteration path 2 of the two paths of decision 123: Threads 16 (a different thread count gives a different barrier path, S4O-3 / S4N C2); every other key equal to formal_barrier (unit test tests/research/test_s4q_1.py). The production profile stays formal_barrier
    scaling:                            # (a), (b) of decision 69 (S3B R4) and (c) Kirchhoff row normalisation (S4C-5, decision 84)
      enabled: true
      objective_constants_out: true      # (a) constant-only objective columns removed from the LP, added back after the solve
      store_energy_units: true           # (b) large Stores in GWh / kt
      store_energy_factor: 1000.0
      store_groups: [biomass_pools, sequestration, capture_buffers]
      kirchhoff_row_normalisation: true  # (c) S4C-5 (decision 69 c under decision 84): each Kirchhoff-Voltage-Law row divided by its largest |coefficient| after the LP export, KVL duals restored after the solve (s3b_scaling.normalise_kvl_rows); equivalence test S4C-5 item 1; --kvl-norm off for the comparison
    interior:                            # R4.4 thresholds tied to BarConvTol
      gap_factor: 10                     # relative primal-dual gap and complementarity / scale <= 10 x BarConvTol; primal budget 1e-7 relative = 10 x BarConvTol
      dual_factor: 100                   # normalized stationarity and dual-sign error <= 100 x BarConvTol = 1e-6 (V4 KKT budget, Gurobi OptimalityTol default)
      cleanup_factor: 10                 # reporting cleanup tau_g = 10 x BarConvTol x max|x_g|
      acceptance_basis: solver_tolerances   # S4B-0 (decision 71, option 1): solver_tolerances = primal / dual budgets tied to Gurobi FeasibilityTol / OptimalityTol with row-activity relative terms (scripts_project/s4b_acceptance.py; main) | barconvtol = S3B R4.4 budgets above (comparison, reported alongside)
      feasibility_tol: 1.0e-6            # Gurobi FeasibilityTol default (not set in the profiles, so the solver uses this value)
      optimality_tol: 1.0e-6             # Gurobi OptimalityTol default
      solver_tol_factor: 10              # option 1 (S3B report section 1.4): budget = 10 x the Gurobi tolerance; primal row/column budget 1e-3 + 10 x FeasibilityTol x reference, dual (stationarity, sign) <= 10 x OptimalityTol; gap and complementarity stay <= gap_factor x BarConvTol
      net_zero_reference: country_gross_co2_flow   # relative term of the per-country net-zero rows (A1/A2, A3 COUNTRY_CO2_CAP, B1): annual gross CO2 throughput of the national atmosphere (sum of |port flows| x weights)
      biomass_pool_reference: pool_capacity        # relative term of the finite biomass pools (A1/A2 Store energy-balance and level-bound rows, A3 STORE_ENERGY_* and state equations, B3): pool capacity e_nom
      column_dual_sign_scale: stationarity_scale   # A1/A2 dual-sign error of columns without the bound (free Link-p flows: the reduced cost itself) measured on the column dual activity max(1, |c| + |a|'|pi| + |rc|) like stationarity; V4 form max(1, |rc|) reported alongside. S4C-0 (decision 84 d / 86 f): confirmed by the user; chosen after seeing the S3B/S4A values (stated in every report)
  fuels:                                 # S4C-0 (decision 85, modifies decision 33 after the smoke results): WEO 2025 Table 2.3 2050 prices, one scenario for gas, oil and coal (asserted at build, s4c_layers.check_fuel_prices)
    price_scenario: steps                # steps = STEPS 2050 (main: gas Japan LNG 9.7 USD/MBtu = 27.07 EUR2020/MWh, crude 76 USD/bbl, coal 84 USD/t) | nze = NZE 2050 (low-price sensitivity; D1-S4B main) | cps = CPS 2050 (registered optional value, not a main run); domestic gas production at the same price (decision 43); lignite keeps the cost-layer row
  finance:                               # S4C-0 (decision 90): discount rate / WACC
    wacc_mode: uniform                   # uniform (main: one discount rate for every country, social-planner view; distributed technologies keep 0.04) | country_specific (M08a A7, decision 133: VARIANT derived by scripts_project/m08a_variants.py from a built base - new-build capital costs re-annualised with the real WACC of the asset's country from country_wacc_table, cross-border assets with the mean of the two end countries, Lines included; distributed technologies per distributed_wacc_rule)
    uniform_discount_rate: 0.07          # value in use: technology-data v0.15.0 / pypsa-asean costs.fill_values "discount rate" 0.07 (all rows except decentral heat and solar-rooftop 0.04); SMR / geothermal annuities s2_costs.DISCOUNT 0.07; recorded only, not applied by this key
    country_wacc_table: research_inputs/finance_v5/COUNTRY_WACC_REAL_M08A.csv   # M08a A7 (decision 133): real WACC by country = S4R COUNTRY_WACC_SENSITIVITY_TABLE.csv real_wacc_mid (one method, grade C); TL = mean of KH / LA / MM (registry wacc_country_tl_rule); former COUNTRY_WACC_PUBLIC_SOURCES.csv (model rows DATA_PENDING)
    distributed_wacc_rule: technology_data_fixed   # M08a A7 (decision 133; registry wacc_distributed_rule): technology_data_fixed (MAIN: cost rows with a discount rate below the uniform rate - technology-data 0.04 for solar-rooftop and decentral rows - keep that household rate in country_specific mode, as PyPSA-Eur / technology-data keep a separate decentral rate independent of the system rate; the IEA observatory WACC covers utility-scale projects) | proportional (r_country x 0.04 / 0.07, sensitivity)
  reporting:                             # M08a A9 (M08-10, decisions 125 (4), 133; registry report_currency_rule): report currency only - the model, the LP and every ledger column 'eur' stay EUR2020 (not in the G2.2 subset)
    currency: USD2020                    # ledger exports add USD2020 columns (COUNTRY_COST_LEDGER_DETAIL.csv usd2020 / usd2020_length_split) and COUNTRY_COST_LEDGER_USD2020.csv (s2_solve.py, s4d_ledger.report_currency)
    fx_per_eur2020: inverse_of_input     # M08a supplement 01 item 3 (one rate both ways): inverse_of_input (MAIN: 1 EUR2020 = 1 / fx_usd_to_eur_2020 = 1 / 0.877228632573 = 1.139954 USD2020, the inverse of the registry input rate every USD input is converted with, so a USD input converted to EUR2020 and reported back returns its own value) | a number (comparison only, e.g. 1.1422 = ECB 2020 annual average, registry fx_report_ecb_2020_reference; recorded consistent_with_input false). Former A9 value 1.1422 (0.196 % above the inverse)
  disconnected:                          # M08a A7 (decision 132)
    co2_shipping_intra_asean: allow      # b1: allow (MAIN: CO2 shipping into other ASEAN countries' national stores kept in the disconnected scenario, maritime trade like the liquid fuels, decision 92) | forbid (sensitivity, variant of a disconnected network: CO2 ship / CO2 transit ship / CO2 transit rail into another country's national store removed = no cross-border CO2 transport inside ASEAN, incl. the Lao rail leg (scope confirmed 2026-10-21, M08a supplement 01 item 2); exports to extra-ASEAN storage kept - landlocked LA keeps only its transit corridor to its own extra-ASEAN store (registry disconnected_b1_landlocked_transit_rule); the variant script refuses a result in which a country loses every permanent CO2 sink)
  coalition:                             # M08a A7 (decision 132)
    remove_countries: []                 # "remove one country": the listed ISO2 countries leave the network entirely (buses, loads, generators, storage, gas stores, storage potential, stock, every line / link touching them incl. their half of the cross-border lines, liquid-pool and CO2-shipping access, extra-ASEAN import points located there); international bunker demand kept; variant of a built base network (scripts_project/m08a_variants.py); NOT the decision-91 cross_border.coalition switch
  sector:                                # S4B-0 (decision 70): PyPSA-Eur v2025.07.0 config.default.yaml sector defaults (scripts_project/s4b_layers.py; table research_inputs/sector_v5/SECTOR_SWITCHES_VS_PYPSA_EUR.csv)
    methanation: true                    # line 676: Sabatier per node (H2 + captured CO2 -> node gas bus); carbon per decision 64 (gas producer credit) - former model: not built
    min_part_load_methanation: 0.3       # line 737
    electrobiofuels: true                # line 779: biomass + H2 -> oil (Fischer-Tropsch based) - former model: not built
    min_part_load_fischer_tropsch: 0.5   # line 735 - former model: 0 (S1 recipe)
    hydrogen_fuel_cell: true             # line 686 (already built: upstream add_hydrogen)
    SMR: true                            # line 688 (already built: S1 recipe)
    SMR_cc: true                         # line 689 (already built: S1 recipe)
    biomass_to_liquid: true              # line 777 (already built: S2 biomass layer)
  s3:                                    # step 3 layers (scripts_project/s3_layers.py)
    fuel_carbon_mode: origin_neutral     # S3-5 (decision 64): origin_neutral = non-fossil liquid fuels zero at combustion, carbon booked at synthesis in the producer country, imports zero | producer_credit = S2 behaviour (sensitivity)
    industry:                            # S3B R2 (decision 67)
      other_bucket: pypsa_eur_2050       # pypsa_eur_2050 = UNSD other / construction / mining mapped to the PyPSA-Eur 'Other industrial sectors' 2050 ratios (main) | idees_today = JRC-IDEES-2021 EU27 2019 carrier structure of that sector, no process switch (sensitivity; *_OTHER_IDEES_TODAY tables) | asean_own_2019 = the country's own UNSD 2019 carrier composition, no conversion (S4B-0, S3B section 8 item 6; implemented only, not run; *_OTHER_ASEAN_OWN_2019 tables)
    gas:                                 # S3-1 (decisions 15, 35, 43, 17, 19)
      existing_cross_border: research_inputs/gas_v5/GAS_PIPELINES_EXISTING_CROSS_BORDER_2025.csv   # GEM GGIT 2025-11 (batch 9), node pairs with basis; rows without capacity DATA_PENDING
      production_caps: research_inputs/gas_v5/GAS_PRODUCTION_CAPS_2050.csv   # UNSD 2019 gross production per country (D1), price = import price, fugitive factor S2-0
      production_node_allocation: gem_fields    # S4A-2 (S3 section 11 item 8): gem_fields = shares of the latest-year production of the GEM GOGET 2026-03 operating gas fields mapped to the nearest node (research_inputs/fleet_v5/GAS_PRODUCTION_NODE_SHARES_GEM.csv; countries without a field fall back to load shares, DATA_PENDING) | load_shares = S3-1 grade-C electricity load shares
      gem_field_shares: research_inputs/fleet_v5/GAS_PRODUCTION_NODE_SHARES_GEM.csv
      lng_terminals: research_inputs/lng_terminals_v5/LNG_IMPORT_TERMINALS_GEM_2025.csv   # D1 registry; existing = operating + construction
      lng_expansion: capex_only           # M08a A4 (M08-3, decision 131; registry lng_terminal_cap_rule): capex_only (MAIN: no capacity cap at any terminal node - p_nom_max = inf incl. proposed-only sites, GEM GGIT 2025-09 operating + construction capacity as the existing lower bound - expansion priced at lng_expansion_capital_cost_eur_per_mw_a; the decision-72 2.5 x cap removed) | cap_factor_cost (S4B-0 decision 72, former main: expansion up to lng_cap_factor x existing, proposed-only sites up to the proposed capacity, priced; sensitivity option (c)) | uncapped_cost (S4E-2 name of the same rule as capex_only) | existing_only (S3B R3, sensitivity) | cap_factor (former S3 rule at zero capex)
      lng_cap_factor: 2.5                 # decision 17, used when lng_expansion = cap_factor / cap_factor_cost: expansion cap = 2.5 x existing per terminal node; proposed-only sites: p_nom_max = proposed capacity; also the liquid-H2 terminal cap (S3-2) in every mode (unchanged by M08a A4)
      lng_expansion_capital_cost_eur_per_mw_a: 8020.43343542   # M08a A4 (M08-3, decision 131; registry lng_terminal_expansion_capex_main): Ulvestad & Overland (2012) converted to EUR2020 (price year 2011 assumed; registry lng_regas_capex_ref_ulvestad_overland_2012), grade C +-50 %; former 7,018 (PyPSA-Eur import branch 5a87cedd line 4561, no source / price year, DATA_PENDING)
      lng_expansion_cost_sensitivity: 0.0   # decision 72 sensitivity: -0.5 / +0.5 on the expansion capital cost
      lng_regasification_adder_eur_per_mwh: 1.26   # M08a A4 (M08-3, F12 / R3.4, decision 131; registry fuel_price_lng_regasification_adder): 0.5 USD2024/MMBtu x 0.73606 / 0.29307 MWh per MMBtu = 1.26 EUR2020/MWh on the LNG import marginal cost (observed 0.3-1.3 USD/MMBtu; grade C); former 0.0 (DATA_PENDING)
    imports:                             # S3-2 (decisions 17, 18, 64): extra-ASEAN imports, same prices in both scenarios, imports only
      price_table: research_inputs/imports_v5/IMPORT_PRICES_2050.csv   # Neumann et al. 2025 Zenodo results (2040, min over exporters) x 1.20 (s3_2_imports_data.py)
      markup: 0.20                         # decision 17 (already applied in the table; documented here)
      price_sensitivity: 0.0               # sensitivity switch: -0.2 / +0.2 on the applied green-carrier prices
      h2_terminal_capital_cost_rule: lng_x_factor   # M08a A4 (decision 131): lng_x_factor (MAIN: liquid-H2 terminal annuity = research.s3.gas LNG terminal expansion cost incl. its sensitivity x h2_terminal_lng_cost_factor = 8,020.43 x 1.2 = 9,624.52 EUR2020/MW/a) | fixed (h2_terminal_capital_cost_eur_per_mw_a below, former)
      h2_terminal_lng_cost_factor: 1.2      # PyPSA-Eur import branch 5a87cedd lines 4560-4563 relation liquid H2 = LNG terminal x 1.2
      h2_terminal_capital_cost_eur_per_mw_a: 8421.6   # rule fixed only (former main): PyPSA-Eur import branch 5a87cedd lines 4560-4563: LNG terminal 7018 EUR/MW/a x 1.2 for liquid H2
      oil_pool: regional                    # one ASEAN oil pool (decision 18); coal/lignite per node unchanged
    shipping:                            # S3-4 (decision 10, D1 section 4): D1 shipping demand (domestic + international bunkers) x PyPSA-Eur 2050 shares (registry share_shipping_*_2050)
      shipping_oil_efficiency: 0.40        # PyPSA-Eur v2025.07.0 config.default.yaml line 636
      shipping_methanol_efficiency: 0.46   # line 635; methanol demand = oil-equivalent x 0.40 / 0.46 (add_shipping lines 5195-5200)
