        gdp: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_gdp_TD_SENSITIVITY.csv
        population: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_population_TD_SENSITIVITY.csv
        aeo8_ats_relative_level: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_aeo8_ats_relative_level_TD_SENSITIVITY.csv
      ammonia_methanol_mode: regional_buses   # S3-3 (decision 44): ammonia load on ASEAN ammonia, methanol via node use links on ASEAN methanol | convert_to_h2_and_gas = S3-0 interim (ammonia -> H2 + electricity, methanol -> methane + electricity)
      pypsa_eur_tables:                     # per country-allocation variant (research.demand.country_allocation)
        aeo8_ats_relative: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_aeo8_ats_relative.csv
        gdp: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_gdp.csv
        population: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_population.csv
        aeo8_ats_relative_level: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_aeo8_ats_relative_level.csv
      biomass_overflow_to_methane: true     # R1.6 / decision 36: fixed solid-biomass demand above the national potential is served by methane at equal heat
      biomass_overflow_cap_share: 0.98      # S4M-1 (decision 115, 2026-10-19 12:12 SGT; scripts_project/s2_layers.py): 0.98 = MAIN: where the decision-36 rule binds (fixed biomass demand >= biomass_overflow_binding_ratio x potential, i.e. BN, SG, VN - demand exactly equal to the potential is a boundary case created by the rule, grade-C potential, 100 % yearly harvest unrealistic) the cap is 0.98 x potential and the extra 2 % moves to methane by the same rule (industry first, then agriculture) | 1.0 = cap = potential (S4K / L23 state; second-batch sensitivity). S4L-5 diagnostic (S4L report section 10): both scenarios optimal, all gates passed
      biomass_overflow_binding_ratio: 0.999  # S4L-5: a country counts as binding when fixed biomass demand / potential >= this value
      low_temperature_heat_share_of_fuels: 0.20   # bas_fixed only (dropped in pypsa_eur_2050: ratio heat row instead); grade C: heat = 2/3 of industrial energy x 30 % below 150 C; range 0.10-0.30
      existing_boiler_efficiency: 0.90    # fuel -> low-temperature heat conversion of the displaced fuel share (technology-data solid biomass boiler steam 0.90)
      feedstock_carbon_mode: territorial    # R2 (decision 56): territorial = EDGAR 2.B+2.D x multiplier on the process bus + domestic plastics burned (s2b_feedstock.py) | full_release = PyPSA-Eur default (sensitivity)
      territorial_tables:
