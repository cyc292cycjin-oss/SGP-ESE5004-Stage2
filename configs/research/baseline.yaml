    candidate_num_parallel: one_circuit   # S4H-2 a (decision 101; scripts_project/s4h_layers.py): one_circuit (main: num_parallel = 1 of 'Al/St 240/40 4-bundle 380.0' for every zero-capacity AC candidate line, x / r / b by the line type; model convention - PyPSA-Eur has no zero-capacity AC candidates) | template43 (former convention: num_parallel 1.286 of template line 43, comparison)
  bunkers:                                # S4C-3 (decision 88, modifying decision 10): international aviation and shipping bunkers (scripts_project/s4c_layers.apply_bunker_attribution)
    attribution: asean_pool               # asean_pool (main: bunker demand on the regional liquid buses, not attributed to any country; fossil combustion in the separate 'co2 bunkers ASEAN' account, net zero on its own, no national removals transferred) | bunkering_country (former state, decision 10) | excluded (demand and emissions not bound; drives research.s2.demand.international_bunkers to false)
  co2:                                    # S4C-4 (decision 89): extra-ASEAN CO2 storage option (scripts_project/s4c_layers.apply_extra_asean_storage; unit cost scripts_project/s4c_4_data.py)
    extra_asean_storage: "on"             # on (main: per country an uncapped export from the captured-CO2 buffers to an extra-ASEAN offshore sink at registry co2_extra_asean_storage_cost = 40.75 EUR2020/t, IEAGHG 2004 ship transport 4,500 km + ZEP 2011 offshore storage, grade C +-50 %; counts as storage of the capturing country, decision 20; both scenarios) | off (sensitivity: reproduces the infeasible disconnected case)
    extra_asean_export_nodes: coastal     # S4D-1 (decision 93; scripts_project/s4d_layers.py): coastal (main: export links only at the coastal nodes of coastal_nodes_table - onshore region touching the physical coast incl. internal / archipelagic waters, or a sea port / LNG record, converter nodes <= 5 km from the sea; user decision 2026-10-17; inland CO2 reaches the coast through domestic CO2 pipelines, decision 35) | all (S4C-4 behaviour)
    coastal_nodes_table: research_inputs/co2_v5/COASTAL_NODES_S4D1_FINAL.csv   # scripts_project/s4d_1_coastline.py
    landlocked_transit: "on"              # S4D-1 (decision 93): on (main: per LA node a transit export link, marginal cost = rail land leg to the nearest neighbouring coast, registry co2_lao_transit_land_cost_<node>, Stolaroff et al. 2021 Table 2, grade C +-50 %, + the extra-ASEAN unit cost on the store; trade like decision 44; both scenarios) | off
    intra_asean_shipping: "on"            # S4D-2 (decision 92, revised): on (main: from every coastal buffered node to every other country's national store 'co2 sequestered <ISO2>' - occupies the receiver's annual cap, pays its store unit cost; counts as the exporter's abatement; IEAGHG 2004 Table 5-3 chain by great-circle km x route factor; border_class maritime_trade, kept in both scenarios like the liquid fuels, decisions 18 / 44, outside B5) | off
    ship_routes_table: research_inputs/co2_v5/CO2_SHIP_ROUTES_S4D2.csv   # scripts_project/s4d_2_ship_routes.py (landing node = shortest sea path; great-circle km per pair)
    ship_route_factor_scale: 1.0          # x registry co2_ship_route_factor (1.091, derived, grade C) in route_factor mode; x the sea-path distance in sea_path mode (S4D-6 / S4E-2)
    ship_distance: sea_path               # S4E-2 (decision 95 b): sea_path (main: pair-specific shortest sea path, CO2_SHIP_ROUTES_S4D2.csv sea_km) | route_factor (great-circle x 1.091, comparison)
    extra_asean_cost_basis: unified       # S4E-2 (decision 95 a, modifies the unit cost of decision 89): unified (main: one storage cost basis - extra-ASEAN = IEAGHG 2004 shipping 4,500 km 24.70 + research.s2.co2.sequestration_cost_eur_per_t 30 = 54.70 EUR2020/t; ZEP 2011 Medium 16.05 for all storage = override s2.co2.sequestration_cost_eur_per_t=16.0535; +-50 % via extra_asean_cost_scale) | s4c4 (former 40.75)
    lao_transit_shipping: "on"            # S4E-2 (decision 95 c): on (main: after the rail transit to the nearest coast, Lao CO2 can be shipped along the routes of that coastal node into other ASEAN national stores; land + ship leg, receiver storage) | off
    lao_transit_destination: nearest_coast   # S4E-2 (95 d): nearest_coast (main, nearest physical coast) | existing_port (sensitivity: nearest sea port of the author WPI subset)
    lao_transit_mode: rail                # S4E-2 (95 d): rail (main, Stolaroff 2021 0.044 $/t-km + 2 $/t) | truck (sensitivity, 0.111 $/t-km)
    lao_transit_vn_store: "on"            # S4F-2 c (decision 97 c): on (main: after the rail transit to a Vietnamese coastal node, Lao CO2 can enter the Vietnamese national store - land leg on the link 'CO2 transit rail', VN store cost and annual cap on the store; trade class, both scenarios) | off
    lao_transit_th_store: "on"            # S4G-2 (decision 99 b): on - effective only with lao_transit_destination = existing_port: LA nodes whose transit ends at a Thai port (Si Racha, TH2 3) can enter the Thai national store by the rule of decision 97 c (land leg on 'CO2 transit rail', Thai store cost and cap on the store, trade class); main (nearest_coast) unchanged | off
  s2:                                   # S2 (2026-10-15): CO2, biomass, demand, industrial heat; S2 instruction + supplement 01
    status: S2_SECTOR_COUPLED_SMOKE       # replaces INTERIM_S1_SKELETON; still SMOKE_TEST_ONLY until the cloud run (decision 47)
    co2:
