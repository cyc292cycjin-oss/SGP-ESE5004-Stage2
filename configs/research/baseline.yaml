      storage_potential_source: eria_gccsi_2024_unified   # M08a A5 (M08-4, decision 131; registry co2_storage_unified_table): eria_gccsi_2024_unified (MAIN: ERIA-GCCSI 2024 P50 - VN 5.30, PH 0.067, MY 128.8, ID 51.3, BN 18.6, TH 16.0 Gt; KH 0.09 Gt IJGGC 2014 low case; TL / LA / MM 0, LA / MM UNASSESSED; SG 0; cap = potential / storage_years, scripts_project/s2_layers.co2_storage_caps) | registry_d1 (former: D1 potentials incl. IEA 2021 VN 11.8 / PH 22.3, OGCI KH 0.085 / TL 0.25; registry co2_injection_cap_*)
      storage_potential_table: research_inputs/co2_v5/CO2_STORAGE_POTENTIAL_UNIFIED.csv   # scripts_project/m08a_data.py a5
      storage_potential_case: p50         # p50 (main) | low (ERIA P90 + net hydrocarbon) | high (ERIA P10; KH 45 Gt hydrodynamic case) - sensitivities
      sequestration_cost_eur_per_t: 30.0  # PyPSA-Eur v2025.07.0 config.default.yaml sector.co2_sequestration_cost (grade C, +-50 %); ADB 2013 reference 17 USD2011/t
      vent: false                         # S4B-0 (decision 70): PyPSA-Eur v2025.07.0 co2_vent false (config line 679); former S2 value true (captured CO2 vented to the capturing country's atmosphere; no confirmed decision; every smoke so far vented 0) kept as sensitivity
      dac: true                           # decision 11; sensitivity switch
      dac_heat_mode: industry_heat_bus    # R6 (decision 60): DAC heat (technology-data heat-input 1.6 - compression-heat-output 0.2 MWh_th/t) from the node industrial low-T heat bus; electric_cop1 = S2 treatment kept as sensitivity
      cc_fraction_source: sector.cc_fraction
      pipeline_topology: electricity_network_topology   # R5 (decision 59): see research.s2.pipelines (former: h2_pipeline_routes)
      process_emissions_scope: [minerals, metals]   # 2.A and 2.C on the process bus; 2.B/2.D/4.C covered by feedstock carbon (method question)
    pipelines:                            # R5 (decision 59): H2 and CO2 candidate corridors
      topology: electricity_network_topology   # PyPSA-Eur v2025.07.0 prepare_sector_network.create_network_topology (lines 368-420): one candidate per connected node pair (AC lines + DC links incl. the 24 corridors); no dedup/shortest-path post-processing
      length_factor: 1.25                 # great-circle distance x factor; PyPSA-Eur config.default.yaml lines 325 (lines.length_factor) and 341 (links.length_factor)
      length_factor_source: "PyPSA-Eur v2025.07.0 config/config.default.yaml lines 325, 341"
