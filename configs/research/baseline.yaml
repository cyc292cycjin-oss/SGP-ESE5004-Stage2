      ratio_source: jrc_idees_2021          # S3-0 (decision 61): jrc_idees_2021 = PyPSA-Eur v2025.07.0 sector ratios reproduced from JRC-IDEES-2021 for ALL sub-sectors incl. steel/cement (main) | technology_data_v015 = S2B steel/cement substitutes (sensitivity)
      technology_data_sensitivity_tables:   # ratio_source technology_data_v015
