# Research demand/carrier/carbon contracts only; never an upstream solve config.
research_demand:
  schema: phase4-gate2-v1
  mode: static_demand_only
  builder: scripts_project/build_research_demand.py
  input_directory: research_inputs/demand
  electricity_parent: electricity_parent.csv
  tables:
    - electricity_parent.csv
    - buildings_accounting.csv
    - transport_accounting.csv
    - industry_accounting.csv
    - agriculture_accounting.csv
    - bunker_accounting.csv
  numeric_acceptance_required: true
  legacy_demand_builders: forbidden
  astar_boundary: end_user_final_electricity
  aeo8_generation_target: false
  aeo8_final_electricity_role: assembly_v1_regional_anchor
  heat_without_accepted_service: embedded
  future_growth_fallback: forbidden
  solver_allowed: false

research_carrier_architecture:
  schema: phase4-gate3-v1
  mode: static_fragments_only
  builder: scripts_project/carrier_architecture.py
  ownership: explicit_node_country
  cross_border_h2: false
  cross_border_gas: false
  cross_border_co2: false
  cross_border_biomass: false
  cross_border_synthetic_fuels: false
  ammonia: deferred
  methanol: deferred
  external_h2_imports: deferred
  h2_export_obligation: deferred_pending_accepted_boundary
  external_market: independent_source_generators_shared_price_metadata_only
  finite_resource_allocation: human_accepted_only_no_replication
  co2_feedstock: local_captured_pool
  co2_geology: local_nonwithdrawable_inventory
  electricity_intervention: deferred_keep_identical_interfaces
  topology_repair: repaired_d13d5976
  solver_allowed: false

research_carbon:
  policy_name: PolicyCO2_Power
  reporting_name: ReportingCO2_FullSystem
  policy_enabled: false  # Preserve original baseline co2.budget.enable=false.
  budget_tco2_per_year:
    2025: 1000000000
    2030: 820000000
    2035: 640000000
    2040: 460000000
    2045: 280000000
    2050: 100000000
  power_scope: explicit_accepted_component_coefficients
  shared_smr_chp_attribution: pending_human_accepted_split
  atmosphere: reporting_only_zero_policy_carrier_factor
  reporting_creates_cap: false
  full_system_cap: forbidden
  origin_neutrality_assumption: forbidden
  preserved_baseline_enable_semantics: true

# Gate4 input gate only. A runnable Full-SC assembly is blocked until the
# target-year source, supply and allocation gates close. Carbon attribution
# is validated on the actual network after export, before Gate4 can pass.
demand_data:
  update_data: false
final_adjustment:
  only_elec_network: false
research_assembly:
  schema: phase4-gate4-layered-v2
  builder: scripts_project/build_research_network.py
  allocation_builder: scripts_project/allocate_assembly_inputs.py
  research_workflow: workflow/research_assembly.smk
  input_registry: research_inputs/assembly_v1/registry.json
  target_year: 2050
  base_year: 2019
  accepted_status: ASSEMBLY_V1_ACCEPTED
  preflight: scripts_project/check_assembly_inputs.py
  legacy_final_adjustment: forbidden
  legacy_sector_demand_builders: forbidden
  target_year_fallback: forbidden
  network_export_enabled: true # Authorized, but executable input/allocation/asset gates must pass.
  blocked_reason: actual_source_accounts_and_qualified_asset_bundle_incomplete
  scenario_switching: false
  solver_allowed: false
  demand_scenario: AEO8_BAS
  road_parent_method: ASSEMBLY_V1_AEO8_ROAD_PARENT_APPROX
  road_non_electric_method: ASSEMBLY_V1_ROAD_NON_ELECTRIC_TRANSPORT_GROWTH_PROXY
  road_parent_role: ROAD_TOTAL_REFERENCE_ONLY
  road_parent_exact_total_enforced: false
  mtoe_method: ASSEMBLY_V1_MTOE_CONVENTION_11P63_TWH
  non_electric_growth_method: ASSEMBLY_V1_ACCEPTED_GROWTH_PROXY
  domestic_shipping_aviation_method: ASSEMBLY_V1_DOMESTIC_CONSTANT_2019
  road_ev_representation: EMBEDDED_IN_ASTAR
  road_ev_materialisation: NOT_SEPARATELY_MATERIALISED
  road_ev_pathway: DEFERRED_TO_EV_SENSITIVITY
  international_bunker_method: ASSEMBLY_V1_BUNKER_CONSTANT_2019
  bunker_sensitivity_required: true
  external_fossil_market: ASSEMBLY_V1_EXTERNAL_MARKET_UNCONSTRAINED
  biomass_supply_cap: accepted_country_fixed_obligation_only
  geological_storage_asset: false
  carbon_validation_stage: POST_BUILD_STATIC_VALIDATION_BLOCKER

# ---------------------------------------------------------------------------
# S1 (2026-10-15) sector-coupling skeleton. These keys supersede the Phase3
# isolation contract above (research_carrier_architecture.cross_border_* and
# research_carbon.policy_*), which is retained only as historical record.
# Scenario files integrated.yaml / disconnected.yaml override research.cross_border.
# ---------------------------------------------------------------------------
research:
  stage: S1
  scenario: baseline
  skeleton_status: INTERIM_S1_SKELETON   # electricity demand only; results carry no scientific meaning
  fuel_bus_naming: upstream_space        # "<node> <carrier>" as in scripts/prepare_sector_network.py
  cross_border:                          # decisions 13/41; per carrier; scenario files set all true / all false
    electricity: true
    H2: true
    gas: false                           # gas network not built before step 3
    co2: false                           # CO2 network not built before step 2
  existing_cross_border_electricity:     # decision 15: 2025 capacity is the lower bound, expandable
    corridors_file: research_inputs/corridors/cross_border_corridors.csv
    capacity_year: 2025
    capex_on_existing: false             # existing capacity carries no new CAPEX (PyPSA objective_constant)
    fom_on_existing: true                # annual FOM of existing cross-border capacity added once (fixed-at-1 column)
  transmission:
    volume_limit_mode: inherit_reference_constant   # decision 45 pending: keep the frozen lv2.0 constant as-is
    volume_limit_factor: 2.0                        # used only when volume_limit_mode == factor_of_existing
  nuclear:                                # decision 38; siting table is a grade-C assumption
    evidence_grade: C
    large_pwr:
      carrier: nuclear
      cost_technology: nuclear
      allowed_countries: [BN, KH, ID, LA, MY, MM, PH, TH, TL, VN]   # all except Singapore
    smr:
      carrier: nuclear SMR
      cost_technology: null              # technology-data "SMR" is steam methane reforming, not a reactor
      allowed_countries: [BN, KH, ID, LA, MY, MM, PH, SG, TH, TL, VN]
      p_nom_max: 0.0
      status: DATA_PENDING
  site_candidates:                        # decision 39; structure built, potentials pending -> p_nom_max 0
    geothermal: {carrier: geothermal, component: Generator, cost_technology: geothermal, p_nom_max: 0.0, status: DATA_PENDING}
    ror_new: {carrier: ror, component: Generator, cost_technology: ror, p_nom_max: 0.0, status: DATA_PENDING}
    hydro_new: {carrier: hydro, component: StorageUnit, cost_technology: hydro, p_nom_max: 0.0, status: DATA_PENDING}
    PHS_new: {carrier: PHS, component: StorageUnit, cost_technology: PHS, p_nom_max: 0.0, status: DATA_PENDING}
  hydrogen:                               # upstream add_hydrogen as component library (decision 42)
    production_technologies: [H2 Electrolysis]
    h2_turbine: true                      # upstream proxy: OCGT techno-economics
    underground_storage: false            # no ASEAN cavern data; DATA_PENDING
    network: greenfield_along_grid        # upstream add_links_elec_routing_new_H2_pipelines
    network_limit_GWkm: null              # upstream Europe default 2000 GWkm not applied
    gas_network_repurposing: false        # upstream 0.8 CH4->H2 repurposing factor not applied
    hydrogen_colors: false
  cost_scaling:                           # decision 41; multiplies capital_cost per technology carrier; 1.0 = no change
    nuclear: 1.0
    nuclear SMR: 1.0
    geothermal: 1.0
    ror: 1.0
    hydro: 1.0
    PHS: 1.0
    solar: 1.0
    solar rooftop: 1.0
    onwind: 1.0
    offwind-ac: 1.0
    offwind-dc: 1.0
    OCGT: 1.0
    CCGT: 1.0
    H2 Electrolysis: 1.0
    H2 Fuel Cell: 1.0
    H2 turbine: 1.0
    H2 Store Tank: 1.0
    H2 pipeline: 1.0
    battery: 1.0
    battery charger: 1.0
    home battery: 1.0
    home battery charger: 1.0
    SMR: 1.0
    SMR CC: 1.0
    Fischer-Tropsch: 1.0
    electricity distribution grid: 1.0
    AC: 1.0
    DC: 1.0
  carbon:                                 # decisions 9/10: per-country net zero in 2050
    constraint_scope: per_country         # per_country | asean_total (sensitivity)
    country_cap_tco2: {BN: 0.0, KH: 0.0, ID: 0.0, LA: 0.0, MY: 0.0, MM: 0.0, PH: 0.0, SG: 0.0, TH: 0.0, TL: 0.0, VN: 0.0}
    asean_total_cap_tco2: 0.0
  demand:
    scope: electricity_only_astar         # step 2 (R8) reconnects the other sectors
    status: INTERIM_S1_SKELETON
