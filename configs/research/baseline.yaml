# Research demand/carrier/carbon contracts only; never an upstream solve config.
research_demand:
  schema: phase4-gate2-v1
  mode: static_demand_only
  builder: scripts_project/build_research_demand.py
  input_directory: research_inputs/demand
  electricity_parent: electricity_parent.csv
  tables:
    - electricity_parent.csv
    - buildings_accounting.csv
    - transport_accounting.csv
    - industry_accounting.csv
    - agriculture_accounting.csv
    - bunker_accounting.csv
  numeric_acceptance_required: true
  legacy_demand_builders: forbidden
  astar_boundary: end_user_final_electricity
  aeo8_generation_target: false
  aeo8_final_electricity_role: assembly_v1_regional_anchor
  heat_without_accepted_service: embedded
  future_growth_fallback: forbidden
  solver_allowed: false

research_carrier_architecture:
  schema: phase4-gate3-v1
  mode: static_fragments_only
  builder: scripts_project/carrier_architecture.py
  ownership: explicit_node_country
  cross_border_h2: false
  cross_border_gas: false
  cross_border_co2: false
  cross_border_biomass: false
  cross_border_synthetic_fuels: false
  ammonia: deferred
  methanol: deferred
  external_h2_imports: deferred
  h2_export_obligation: deferred_pending_accepted_boundary
  external_market: independent_source_generators_shared_price_metadata_only
  finite_resource_allocation: human_accepted_only_no_replication
  co2_feedstock: local_captured_pool
  co2_geology: local_nonwithdrawable_inventory
  electricity_intervention: deferred_keep_identical_interfaces
  topology_repair: repaired_d13d5976
  solver_allowed: false

research_carbon:
  policy_name: PolicyCO2_Power
  reporting_name: ReportingCO2_FullSystem
  policy_enabled: false  # Preserve original baseline co2.budget.enable=false.
  budget_tco2_per_year:
    2025: 1000000000
    2030: 820000000
    2035: 640000000
    2040: 460000000
    2045: 280000000
    2050: 100000000
  power_scope: explicit_accepted_component_coefficients
  shared_smr_chp_attribution: pending_human_accepted_split
  atmosphere: reporting_only_zero_policy_carrier_factor
  reporting_creates_cap: false
  full_system_cap: forbidden
  origin_neutrality_assumption: forbidden
  preserved_baseline_enable_semantics: true

# Gate4 input gate only. A runnable Full-SC assembly is blocked until the
# target-year source, supply and allocation gates close. Carbon attribution
# is validated on the actual network after export, before Gate4 can pass.
demand_data:
  update_data: false
final_adjustment:
  only_elec_network: false
research_assembly:
  schema: phase4-gate4-layered-v2
  builder: scripts_project/build_research_network.py
  allocation_builder: scripts_project/allocate_assembly_inputs.py
  research_workflow: workflow/research_assembly.smk
  input_registry: research_inputs/assembly_v1/registry.json
  target_year: 2050
  base_year: 2019
  accepted_status: ASSEMBLY_V1_ACCEPTED
  preflight: scripts_project/check_assembly_inputs.py
  legacy_final_adjustment: forbidden
  legacy_sector_demand_builders: forbidden
  target_year_fallback: forbidden
  network_export_enabled: true # Authorized, but executable input/allocation/asset gates must pass.
  blocked_reason: actual_source_accounts_and_qualified_asset_bundle_incomplete
  scenario_switching: false
  solver_allowed: false
  demand_scenario: AEO8_BAS
  road_parent_method: ASSEMBLY_V1_AEO8_ROAD_PARENT_APPROX
  road_non_electric_method: ASSEMBLY_V1_ROAD_NON_ELECTRIC_TRANSPORT_GROWTH_PROXY
  road_parent_role: ROAD_TOTAL_REFERENCE_ONLY
  road_parent_exact_total_enforced: false
  mtoe_method: ASSEMBLY_V1_MTOE_CONVENTION_11P63_TWH
  non_electric_growth_method: ASSEMBLY_V1_ACCEPTED_GROWTH_PROXY
  domestic_shipping_aviation_method: ASSEMBLY_V1_DOMESTIC_CONSTANT_2019
  road_ev_representation: EMBEDDED_IN_ASTAR
  road_ev_materialisation: NOT_SEPARATELY_MATERIALISED
  road_ev_pathway: DEFERRED_TO_EV_SENSITIVITY
  international_bunker_method: ASSEMBLY_V1_BUNKER_CONSTANT_2019
  bunker_sensitivity_required: true
  external_fossil_market: ASSEMBLY_V1_EXTERNAL_MARKET_UNCONSTRAINED
  biomass_supply_cap: d1_biomass_v5_country_category_stores   # S2-3: the Assembly-V1 regional pool (360 TWh) is retired; potentials per country x category
  geological_storage_asset: false
  carbon_validation_stage: POST_BUILD_STATIC_VALIDATION_BLOCKER

# ---------------------------------------------------------------------------
# S1 (2026-10-15) sector-coupling skeleton. These keys supersede the Phase3
# isolation contract above (research_carrier_architecture.cross_border_* and
# research_carbon.policy_*), which is retained only as historical record.
# Scenario files integrated.yaml / disconnected.yaml override research.cross_border.
# ---------------------------------------------------------------------------
research:
  stage: S1
  scenario: baseline
  skeleton_status: INTERIM_S1_SKELETON   # electricity demand only; results carry no scientific meaning
  fuel_bus_naming: upstream_space        # "<node> <carrier>" as in scripts/prepare_sector_network.py
  s3:                                    # step 3 layers (scripts_project/s3_layers.py)
    gas:                                 # S3-1 (decisions 15, 35, 43, 17, 19)
      existing_cross_border: research_inputs/gas_v5/GAS_PIPELINES_EXISTING_CROSS_BORDER_2025.csv   # GEM GGIT 2025-11 (batch 9), node pairs with basis; rows without capacity DATA_PENDING
      production_caps: research_inputs/gas_v5/GAS_PRODUCTION_CAPS_2050.csv   # UNSD 2019 gross production per country (D1), price = import price, fugitive factor S2-0
      production_node_allocation: load_shares   # grade C: electricity load share per AC node within the country (no field-level basis registered)
      lng_terminals: research_inputs/lng_terminals_v5/LNG_IMPORT_TERMINALS_GEM_2025.csv   # D1 registry; existing = operating + construction
      lng_cap_factor: 2.5                 # decision 17: expansion cap = 2.5 x existing per terminal node; proposed-only sites: p_nom_max = proposed capacity
      lng_regasification_adder_eur_per_mwh: 0.0   # DATA_PENDING (registry fuel_price_lng_regasification_adder): LNG cost understated
    imports:                             # S3-2 (decisions 17, 18, 64): extra-ASEAN imports, same prices in both scenarios, imports only
      price_table: research_inputs/imports_v5/IMPORT_PRICES_2050.csv   # Neumann et al. 2025 Zenodo results (2040, min over exporters) x 1.20 (s3_2_imports_data.py)
      markup: 0.20                         # decision 17 (already applied in the table; documented here)
      price_sensitivity: 0.0               # sensitivity switch: -0.2 / +0.2 on the applied green-carrier prices
      h2_terminal_capital_cost_eur_per_mw_a: 8421.6   # PyPSA-Eur import branch 5a87cedd lines 4560-4563: LNG terminal 7018 EUR/MW/a x 1.2 for liquid H2
      oil_pool: regional                    # one ASEAN oil pool (decision 18); coal/lignite per node unchanged
  cross_border:                          # decisions 13/41; per carrier; scenario files set all true / all false
    electricity: true
    H2: true
    gas: true                            # S3-1: gas pipelines along the unified corridors (candidates + 2025 stock from GEM); scenario files set all true / all false
    co2: false                           # CO2 network not built before step 2
  existing_cross_border_electricity:     # decision 15: 2025 capacity is the lower bound, expandable
    corridors_file: research_inputs/corridors/cross_border_corridors.csv
    capacity_year: 2025
    capex_on_existing: false             # existing capacity carries no new CAPEX (PyPSA objective_constant)
    fom_on_existing: true                # annual FOM of existing cross-border capacity added once (fixed-at-1 column)
  transmission:
    volume_limit_mode: lvopt                        # decision 45 (S2-1): no transmission volume cap in the main run
    volume_limit_factor: 2.79                       # sensitivity: factor_of_existing with the frozen 2.79x (S1 inherit_reference_constant / existing volume)
  nuclear:                                # decision 38; siting table is a grade-C assumption
    evidence_grade: C
    large_pwr:
      carrier: nuclear
      cost_technology: nuclear
      allowed_countries: [BN, KH, ID, LA, MY, MM, PH, TH, TL, VN]   # all except Singapore
    smr:
      carrier: nuclear SMR
      cost_technology: nuclear SMR       # S2-1: AEO8 D.15 Nuclear SMR row appended by s2_costs.py (grade C, decision 46); technology-data "SMR" is steam methane reforming
      allowed_countries: [BN, KH, ID, LA, MY, MM, PH, SG, TH, TL, VN]
      p_nom_max: .inf
      status: PRICED_AEO8_GRADE_C
  site_candidates:                        # decision 39; structure built, potentials pending -> p_nom_max 0
    geothermal: {carrier: geothermal, component: Generator, cost_technology: geothermal, p_nom_max: 0.0, status: DATA_PENDING}
    ror_new: {carrier: ror, component: Generator, cost_technology: ror, p_nom_max: 0.0, status: DATA_PENDING}
    hydro_new: {carrier: hydro, component: StorageUnit, cost_technology: hydro, p_nom_max: 0.0, status: DATA_PENDING}
    PHS_new: {carrier: PHS, component: StorageUnit, cost_technology: PHS, p_nom_max: 0.0, status: DATA_PENDING}
  hydrogen:                               # upstream add_hydrogen as component library (decision 42)
    production_technologies: [H2 Electrolysis]
    h2_turbine: true                      # upstream proxy: OCGT techno-economics
    underground_storage: false            # no ASEAN cavern data; DATA_PENDING
    network: greenfield_along_grid        # upstream add_links_elec_routing_new_H2_pipelines
    network_limit_GWkm: null              # upstream Europe default 2000 GWkm not applied
    gas_network_repurposing: false        # upstream 0.8 CH4->H2 repurposing factor not applied
    hydrogen_colors: false
  cost_layer:                             # D1 (2026-10-15), decision 46 option A; S2-0 (decision 50): three registered layers, switchable here
    active: technology_data_v0_15_0_2050_eur2020   # main run (decision 50): technology-data v0.15.0, year 2050, rebased EUR2025 -> EUR2020 (EA20 GDP deflator)
    layers:
      technology_data_v0_15_0_2050_eur2020:
        file: research_inputs/cost_layers_v5/technology_data_v0.15.0_EUR2020/LAYER_MANIFEST.json
        prepared_file: research_inputs/cost_layers_v5/technology_data_v0.15.0_EUR2020/costs_2050_EUR2020_prepared.csv
        aeo8_overrides: false
      technology_data_v0_13_2_2050:       # sensitivity (D1 main layer)
        file: research_inputs/cost_layers_v5/LAYER_A_TECHNOLOGY_DATA_V0_13_2_2050.json
        aeo8_overrides: false             # the author's append_cost_data step is NOT applied
      aeo8_author_rule_2050:              # sensitivity: AEO8 D.15 x ECB2020 FX x (1 - D.17 2050 decline where labels match)
        file: research_inputs/cost_layers_v5/LAYER_B_AEO8_AUTHOR_RULE_2050.csv
        aeo8_overrides: true
    smr_cost_source: aeo8_author_rule_2050   # decision 46: SMR always from AEO8 D.15 (grade C, +-30 %) in both layers
    registry: research_inputs/registry_v5/DATA_REGISTRY.csv
  s2:                                     # S2 (2026-10-15): CO2, biomass, demand, industrial heat; S2 instruction + supplement 01
    status: S2_SECTOR_COUPLED_SMOKE       # replaces INTERIM_S1_SKELETON; still SMOKE_TEST_ONLY until the cloud run (decision 47)
    co2:
      storage_years: 50                   # decisions 28-30: annual injection cap = potential / 50
      sequestration_cost_eur_per_t: 30    # PyPSA-Eur v2025.07.0 config.default.yaml sector.co2_sequestration_cost (grade C, +-50 %); ADB 2013 reference 17 USD2011/t
      vent: true                          # captured CO2 may be vented to the capturing country's atmosphere (counts as emission)
      dac: true                           # decision 11; sensitivity switch
      dac_heat_mode: industry_heat_bus    # R6 (decision 60): DAC heat (technology-data heat-input 1.6 - compression-heat-output 0.2 MWh_th/t) from the node industrial low-T heat bus; electric_cop1 = S2 treatment kept as sensitivity
      cc_fraction_source: sector.cc_fraction
      pipeline_topology: electricity_network_topology   # R5 (decision 59): see research.s2.pipelines (former: h2_pipeline_routes)
      process_emissions_scope: [minerals, metals]   # 2.A and 2.C on the process bus; 2.B/2.D/4.C covered by feedstock carbon (method question)
    pipelines:                            # R5 (decision 59): H2 and CO2 candidate corridors
      topology: electricity_network_topology   # PyPSA-Eur v2025.07.0 prepare_sector_network.create_network_topology (lines 368-420): one candidate per connected node pair (AC lines + DC links incl. the 24 corridors); no dedup/shortest-path post-processing
      length_factor: 1.25                 # great-circle distance x factor; PyPSA-Eur config.default.yaml lines 325 (lines.length_factor) and 341 (links.length_factor)
      length_factor_source: "PyPSA-Eur v2025.07.0 config/config.default.yaml lines 325, 341"
      underwater_fraction: corridor_subsea_share   # cross-border pairs from cross_border_corridors.csv subsea_share (all 0 in the frozen base); domestic pairs 0 (no data)
    biomass:
      potential_layer: main               # BIOMASS_POTENTIAL_2050.csv potential_main_mwh; low/high are sensitivities
      categories_excluded: [logging_residues]   # ZERO_BY_DECISION (decision 54)
      cross_border: false                 # decision 36
    demand:
      table: research_inputs/demand_v5/DEMAND_2050_BY_COUNTRY_SECTOR_CARRIER.csv   # aeo8_ats_relative variant; research.demand.country_allocation selects _GDP_SENSITIVITY / _POP_SENSITIVITY
      tables_by_allocation:
        aeo8_ats_relative: research_inputs/demand_v5/DEMAND_2050_BY_COUNTRY_SECTOR_CARRIER.csv
        gdp: research_inputs/demand_v5/DEMAND_2050_BY_COUNTRY_SECTOR_CARRIER_GDP_SENSITIVITY.csv
        population: research_inputs/demand_v5/DEMAND_2050_BY_COUNTRY_SECTOR_CARRIER_POP_SENSITIVITY.csv
      node_allocation: assembly_v1_allocation_shares_then_astar   # node shares per (country, account) from results_project/assembly_v1/final_allocation
      time_shape: flat_fuels_astar_shape_electricity
      international_bunkers: true         # decision 10; sensitivity switch
      shipping: deferred_to_S3            # domestic and international shipping fuel not bound in S2
      land_transport_shares: pypsa_eur_v2025.07.0   # D1 section 4 registry rows share_land_transport_*
      bev_dsm: false                      # no ASEAN fleet data (number of cars) -> no DSM store; DATA_PENDING
      clean_cooking: true                 # decision 23: traditional biomass cooking -> useful energy served by modern stoves (electricity/gas/LPG)
      cookstove_efficiency_source: IEA Defining energy access 2020 methodology, Table 2 (Indonesia, Thailand, Other Southeast Asia)
    industry:
      carrier_mode: pypsa_eur_2050          # R1 (decision 55): pypsa_eur_2050 = 2050 process routes (s3_0_industry.py) | bas_fixed = AEO8 BAS 2019 carrier shares x multiplier (former main, comparison)
      ratio_source: jrc_idees_2021          # S3-0 (decision 61): jrc_idees_2021 = PyPSA-Eur v2025.07.0 sector ratios reproduced from JRC-IDEES-2021 for ALL sub-sectors incl. steel/cement (main) | technology_data_v015 = S2B steel/cement substitutes (sensitivity)
      technology_data_sensitivity_tables:   # ratio_source technology_data_v015
        aeo8_ats_relative: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_aeo8_ats_relative_TD_SENSITIVITY.csv
        gdp: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_gdp_TD_SENSITIVITY.csv
        population: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_population_TD_SENSITIVITY.csv
      ammonia_methanol_mode: convert_to_h2_and_gas   # S3-0 interim: ratio ammonia row -> H2 + electricity (PyPSA-Eur ammonia:false route, config lines 849/852/853), methanol row -> methane + electricity (SMR route, lines 904-906); S3-3: regional_buses
      pypsa_eur_tables:                     # per country-allocation variant (research.demand.country_allocation)
        aeo8_ats_relative: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_aeo8_ats_relative.csv
        gdp: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_gdp.csv
        population: research_inputs/demand_v5/INDUSTRY_2050_SUMMARY_population.csv
      biomass_overflow_to_methane: true     # R1.6 / decision 36: fixed solid-biomass demand above the national potential is served by methane at equal heat
      low_temperature_heat_share_of_fuels: 0.20   # bas_fixed only (dropped in pypsa_eur_2050: ratio heat row instead); grade C: heat = 2/3 of industrial energy x 30 % below 150 C; range 0.10-0.30
      existing_boiler_efficiency: 0.90    # fuel -> low-temperature heat conversion of the displaced fuel share (technology-data solid biomass boiler steam 0.90)
      feedstock_carbon_mode: territorial    # R2 (decision 56): territorial = EDGAR 2.B+2.D x multiplier on the process bus + domestic plastics burned (s2b_feedstock.py) | full_release = PyPSA-Eur default (sensitivity)
      territorial_tables:
        aeo8_ats_relative: research_inputs/registry_v5/FEEDSTOCK_CARBON_TERRITORIAL_2050_aeo8_ats_relative.csv
        gdp: research_inputs/registry_v5/FEEDSTOCK_CARBON_TERRITORIAL_2050_gdp.csv
        population: research_inputs/registry_v5/FEEDSTOCK_CARBON_TERRITORIAL_2050_population.csv
      feedstock_process_share_source: edgar_2B_over_feedstock_carbon   # full_release mode only: S2-0 FEEDSTOCK_CARBON_BOUNDARY_2019.csv, capped at 1
      feedstock_end_of_life_release_fraction: 1.0   # full_release mode only: PyPSA-Eur default (HVC_environment_sequestration_fraction 0)
      hvc_recycling_applies_to_naphtha: true        # HVC_primary_fraction 0.4 (D1 registry) reduces primary petrochemical feedstock; chemical recycling electricity added
      steel_aluminium_routes: "steel: worldsteel 2019 + PyPSA-Eur St_primary_fraction 0.3 / DRI_fraction 1.0 (R1); aluminium: DATA_PENDING (no ASEAN production split)"
    gap_diagnostic:                       # decisions 49, 53: off in the main run; separate labelled run
      enabled: false
      penalty_eur_per_mwh: 10000          # electricity slack; above any supply cost in the model (max marginal ~ 300 EUR/MWh)
      penalty_eur_per_tco2: 10000         # CO2 slack; above the DAC levelised cost (< 1,000 EUR/t at the registered costs)
  cost_scaling:                           # decision 41; multiplies capital_cost per technology carrier; 1.0 = no change
    nuclear: 1.0
    nuclear SMR: 1.0
    geothermal: 1.0
    ror: 1.0
    hydro: 1.0
    PHS: 1.0
    solar: 1.0
    solar rooftop: 1.0
    onwind: 1.0
    offwind-ac: 1.0
    offwind-dc: 1.0
    OCGT: 1.0
    CCGT: 1.0
    H2 Electrolysis: 1.0
    H2 Fuel Cell: 1.0
    H2 turbine: 1.0
    H2 Store Tank: 1.0
    H2 pipeline: 1.0
    battery: 1.0
    battery charger: 1.0
    home battery: 1.0
    home battery charger: 1.0
    SMR: 1.0
    SMR CC: 1.0
    Fischer-Tropsch: 1.0
    electricity distribution grid: 1.0
    AC: 1.0
    DC: 1.0
  carbon:                                 # decisions 9/10: per-country net zero in 2050
    constraint_scope: per_country         # per_country | asean_total (sensitivity)
    country_cap_tco2: {BN: 0.0, KH: 0.0, ID: 0.0, LA: 0.0, MY: 0.0, MM: 0.0, PH: 0.0, SG: 0.0, TH: 0.0, TL: 0.0, VN: 0.0}
    asean_total_cap_tco2: 0.0
  demand:
    scope: electricity_only_astar         # step 2 (R8) reconnects the other sectors
    status: INTERIM_S1_SKELETON
    country_allocation: aeo8_ats_relative   # R3 (decision 57): aeo8_ats_relative (main) | gdp (former main, sensitivity) | population; selects the D1 demand table variant
